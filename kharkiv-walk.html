<head>

  <meta name="color-scheme" content="dark">

  <meta name="mobile-web-app-capable" content="yes">

  <title>Харків за день</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:wght@400;700&family=Montserrat:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
:root {
  color-scheme: dark;

  /* Палітра NES */
  --nes-black: #0c0e0c;
  --nes-white: #eaebea;
  --nes-beige: #efc094;
  --nes-bg-navy: #141519;
  --nes-bg-plum: #585360;
  --nes-bg-wine: #58363b;
  --nes-cyan: #12c5c5;
  --nes-cream: #fff7e9;
  --nes-silver: #dfe0df;

  --nes-font-display: "Oswald", "Arial Narrow", sans-serif;
  --nes-font-body: "Montserrat", "Segoe UI", Arial, sans-serif;
  --nes-font-mono: "Anonymous Pro", "Consolas", monospace;
  --nes-font-pixel: "Press Start 2P", "Anonymous Pro", monospace;

  --nes-radius-md: 12px;
  --nes-radius-lg: 20px;
}

* { box-sizing: border-box; margin: 0; }

html, body { height: 100%; overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

body {
  background: var(--nes-black);
  color: var(--nes-white);
  font-family: var(--nes-font-body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

.nes-logo { font-family: var(--nes-font-body); font-weight: 400; letter-spacing: 0.02em; color: var(--nes-white); }
.nes-pixelated { image-rendering: crisp-edges; image-rendering: pixelated; }

.app {
  height: 100vh;
  height: var(--app-h, 100dvh);
  max-width: 480px;
  margin: 0 auto;
  display: grid;
  grid-template-rows: minmax(150px, 28%) 1fr auto;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}

/* ---------- Ілюстрація місця ---------- */
.scene { position: relative; overflow: hidden; }

#scene { position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }

.bar {
  position: absolute; z-index: 2; top: 12px; left: 16px;
  display: inline-flex; align-items: baseline; gap: 12px;
  padding: 7px 14px;
  border-radius: 999px;
  background: rgba(12, 14, 12, 0.78);
  border: 1px solid rgba(88, 83, 96, 0.6);
}
.bar-title {
  font-family: var(--nes-font-mono);
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--nes-beige);
}

.progress {
  position: absolute; z-index: 2;
  left: 16px; right: 16px; bottom: 12px;
  display: flex; align-items: center; gap: 12px;
  padding: 9px 14px;
  border-radius: 999px;
  background: rgba(12, 14, 12, 0.78);
  border: 1px solid rgba(88, 83, 96, 0.6);
}
.segs { display: flex; gap: 2px; flex: 1; }
.seg { height: 6px; flex: 1; background: var(--nes-bg-plum); border-radius: 1px; }
.seg.on { background: var(--nes-beige); }
.count {
  font-family: var(--nes-font-pixel);
  font-size: 10px;
  color: var(--nes-beige);
  font-variant-numeric: tabular-nums;
}

/* ---------- Додаткове фото точки ---------- */
.extra { margin-top: 24px; }
.extra[hidden] { display: none; }
.extra-img {
  display: block; width: 100%; height: auto;
  border-radius: var(--nes-radius-md);
}

/* ---------- Таксі ---------- */
.taxi {
  margin-top: 16px;
  padding: 20px;
  display: flex; flex-direction: column; gap: 16px;
  border-radius: var(--nes-radius-md);
  background: var(--nes-black);
  border: 1px solid var(--nes-amber);
}
.taxi[hidden] { display: none; }
.taxi-top { display: flex; align-items: center; gap: 16px; }
.taxi-icon { flex: none; width: 124px; height: auto; }
.taxi-info { min-width: 0; flex: 1; }
.taxi .eyebrow { margin-bottom: 6px; }
.taxi-to { font-family: var(--nes-font-display); font-weight: 600; font-size: 20px; line-height: 1.2; text-transform: uppercase; letter-spacing: 0.04em; color: var(--nes-white); }

.taxi-copy {
  position: relative;
  display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center;
  width: 100%; min-height: 0;
  padding: 14px 16px;
  border: 1px solid var(--nes-bg-plum); border-radius: var(--nes-radius-md);
  background: var(--nes-bg-navy); color: var(--nes-white);
  text-align: left; font: inherit; cursor: pointer;
  transition: background 150ms ease, border-color 150ms ease;
}
.taxi-copy:hover { background: var(--nes-bg-plum); border-color: var(--nes-beige); }
.taxi-copy:focus-visible { outline: 2px solid var(--nes-cyan); outline-offset: 3px; }
.taxi-copy-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.taxi-label { font-family: var(--nes-font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--nes-beige); }
.taxi-addr { font-size: 15px; line-height: 1.4; color: var(--nes-white); }
.taxi-copy-icon { color: var(--nes-beige); }
.taxi-hint { grid-column: 1 / -1; font-family: var(--nes-font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--nes-silver); }
.taxi-hint.ok { color: var(--nes-mint); }

/* ---------- Схема ходу ---------- */
.block { margin-top: 24px; }
.eyebrow {
  margin-bottom: 12px;
  font-family: var(--nes-font-mono);
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--nes-beige);
}

.routemap {
  height: 260px;
  border-radius: var(--nes-radius-md);
  background: var(--nes-black);
  border: 1px solid rgba(88, 83, 96, .6);
}
#map { width: 100%; height: 100%; display: block; }

.river { fill: none; stroke: var(--nes-bg-navy); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }

.leg-line {
  fill: none;
  stroke: var(--nes-bg-plum);
  stroke-width: 2;
  stroke-linecap: round;
  transition: stroke 300ms ease;
}
.leg-line.taxi { stroke-dasharray: 2 7; }
.leg-line.done { stroke: var(--nes-silver); }
.leg-line.active { stroke: var(--nes-beige); stroke-width: 3; }

.dot { fill: var(--nes-black); stroke: var(--nes-bg-plum); stroke-width: 2; transition: fill 300ms ease, stroke 300ms ease; }
.dot.done { fill: var(--nes-silver); stroke: var(--nes-silver); }
.dot.current { fill: var(--nes-beige); stroke: var(--nes-beige); }
.river-edge { fill: none; stroke: var(--nes-bg-plum); stroke-width: 1; stroke-linecap: round; opacity: .5; }
.num { font: 11px var(--nes-font-mono); fill: var(--nes-bg-plum); text-anchor: middle; }
.num.done { fill: var(--nes-silver); }
.num.current { fill: var(--nes-beige); font-weight: 700; }
.lbl { font: 700 11px var(--nes-font-mono); fill: var(--nes-beige); letter-spacing: .08em; text-transform: uppercase; paint-order: stroke; stroke: var(--nes-black); stroke-width: 4px; stroke-linejoin: round; }
.halo { fill: var(--nes-beige); opacity: .18; transform-box: fill-box; transform-origin: center; }

/* ---------- Google Maps ---------- */
.gmap {
  position: relative;
  height: 220px;
  border-radius: var(--nes-radius-md);
  overflow: hidden;
  background: var(--nes-black);
  border: 1px solid rgba(88, 83, 96, .6);
}
.gmap iframe {
  width: 100%; height: 100%; border: 0; display: block;
  pointer-events: none;
  filter: invert(.92) hue-rotate(180deg) saturate(.5) brightness(.9);
}
.gmap-open { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; align-items: flex-end; justify-content: flex-end; padding: 12px; }
.chip {
  padding: 8px 14px;
  border-radius: 999px;
  background: var(--nes-black);
  border: 1px solid var(--nes-bg-plum);
  color: var(--nes-white);
  font: 600 13px/1 var(--nes-font-body);
}
.gmap-open:hover .chip { background: var(--nes-bg-plum); }
.gmap-open:focus-visible { outline: 2px solid var(--nes-cyan); outline-offset: -2px; }

.route-btn {
  margin-top: 12px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 48px;
  border-radius: var(--nes-radius-md);
  border: 1px solid var(--nes-beige);
  color: var(--nes-beige);
  font: 600 15px/1 var(--nes-font-body);
  text-decoration: none;
  transition: background 150ms ease;
}
.route-btn:hover { background: var(--nes-bg-plum); }
.route-btn:focus-visible { outline: 2px solid var(--nes-cyan); outline-offset: 3px; }

/* ---------- Картка ---------- */
.card {
  padding: 24px 24px 24px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  background: var(--nes-bg-navy);
  border-radius: var(--nes-radius-lg) var(--nes-radius-lg) 0 0;
  border: 1px solid rgba(88, 83, 96, .6);
  border-bottom: 0;
}

.head { display: flex; align-items: center; gap: 16px; }
.when { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.until { font-family: var(--nes-font-mono); font-size: 14px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--nes-beige); font-variant-numeric: tabular-nums; }
.after { font-size: 14px; line-height: 1.35; color: var(--nes-silver); }
.after b { font-weight: 600; color: var(--nes-white); }

.time {
  font-family: var(--nes-font-display);
  font-weight: 600;
  font-size: 64px;
  line-height: 1;
  letter-spacing: 0.01em;
  color: var(--nes-cream);
  font-variant-numeric: tabular-nums;
}

.name {
  margin-top: 12px;
  font-family: var(--nes-font-display);
  font-weight: 600;
  font-size: 26px;
  line-height: 1.2;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--nes-white);
}

.leg {
  margin-top: 8px;
  font-family: var(--nes-font-mono);
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--nes-beige);
}
.leg:not(:empty)::before { content: "- "; }
.leg:not(:empty)::after { content: " -"; }
.leg:empty { display: none; }

.desc { margin-top: 16px; max-width: 34em; color: var(--nes-silver); }

.shelter {
  margin-top: 16px;
  padding: 2px 0 2px 14px;
  border-left: 2px solid var(--nes-cyan);
  font-size: 14px;
  color: var(--nes-silver);
}

/* ---------- Кнопки ---------- */
.controls {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 12px;
  padding: 12px 24px 16px;
  background: var(--nes-bg-navy);
}

button {
  -webkit-appearance: none; appearance: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  font: 600 15px/1 var(--nes-font-body);
  min-height: 52px;
  border-radius: var(--nes-radius-md);
  cursor: pointer;
  transition: background 150ms ease, opacity 150ms ease;
}

.back { padding: 0 24px; background: transparent; color: var(--nes-white); border: 1px solid var(--nes-silver); }
.back:hover:not(:disabled) { background: var(--nes-bg-plum); }
.back:disabled { opacity: .3; cursor: default; }

.next { background: var(--nes-beige); color: var(--nes-black); border: 0; }
.next:hover { background: var(--nes-cream); }

button:focus-visible { outline: 2px solid var(--nes-cyan); outline-offset: 3px; }

/* Поява нової точки */
.card.enter > * { animation: rise 360ms cubic-bezier(.2, .7, .2, 1) both; }
.card.enter > :nth-child(2) { animation-delay: 60ms; }
.card.enter > :nth-child(n+3) { animation-delay: 120ms; }

@keyframes rise {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: reduce) {
  .card.enter > * { animation: none; }
  .leg-line, .dot, button { transition: none; }
}
</style>
</head>
<body>
  <noscript><p style="padding:24px;color:#eaebea;font:16px/1.5 sans-serif">Потрібен JavaScript. Відкрий файл у Safari: Поділитися, потім Відкрити в Safari.</p></noscript>

          Побудувати маршрут

      </div>
    </section>

  </main>

(() => {
  const P = {

    amber: "#ca8028", cream: "#fff7e9", silver: "#dfe0df", coral: "#ff8765",
    mint: "#92d5b1", cyan: "#12c5c5"
  };
  const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
  const dith = (x, y, t) => t * 16 > BAYER[y & 3][x & 3] + 0.5;
  const hash = (a, b) => {
    let h = (a * 374761393 + b * 668265263) | 0;
    h = (h ^ (h >>> 13)) * 1274126177;
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
  };

  let ctx;
  const px = (x, y, c) => { ctx.fillStyle = c; ctx.fillRect(x | 0, y | 0, 1, 1); };
  const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x | 0, y | 0, w | 0, h | 0); };
  const D = (x, y, w, h, a, b, t) => {
    for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) px(i, j, dith(i, j, t) ? b : a);
  };
  const glow = (cx, cy, r, c, k = 0.55) => {
    for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) {
      const d = Math.hypot(i, j);
      if (d < r && dith(cx + i, cy + j, (1 - d / r) * k)) px(cx + i, cy + j, c);
    }
  };

  // ---------- Буфет: фасад із маркізою та освітленою вітриною ----------
  function sky(horizon, warm) {
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let c = P.black;
      const t1 = (y - 8) / Math.max(10, horizon * 0.7);
      if (t1 > 0) c = dith(x, y, Math.min(t1, 1)) ? P.navy : P.black;
      const t2 = (y - (horizon - 26)) / 26;
      if (t2 > 0) c = dith(x, y, Math.min(t2, 1) * warm) ? P.wine : P.navy;
      px(x, y, c);

    for (let i = 0; i < 26; i++) {
      const x = (hash(i, 3) * W) | 0, y = (hash(i, 9) * horizon * 0.55) | 0;

  function ground(y) {
    for (let j = y; j < H; j++) for (let i = 0; i < W; i++) px(i, j, dith(i, j, 0.25 + (j - y) / (H - y) * 0.6) ? P.black : P.navy);

    D(26, 28, 108, 38, P.wine, P.navy, 0.35);
    R(24, 26, 112, 4, P.plum);
    for (let x = 30; x < 132; x += 8) R(x, 18, 4, 8, hash(x, 2) > 0.5 ? P.beige : P.amber);
    R(40, 31, 80, 6, P.black); D(44, 33, 72, 2, P.beige, P.amber, 0.5);
    for (let x = 28; x < 132; x += 6) R(x, 38, 6, 7, ((x - 28) / 6) % 2 ? P.cream : P.coral);
    R(32, 48, 52, 18, P.black); D(33, 49, 50, 16, P.amber, P.beige, 0.25);
    for (let x = 38; x < 80; x += 14) { R(x, 56, 6, 2, P.wine); R(x + 2, 58, 2, 6, P.wine); }
    R(94, 46, 16, 20, P.black); R(96, 48, 12, 18, P.wine); px(106, 58, P.beige);
    R(118, 52, 10, 14, P.navy); R(120, 54, 6, 3, P.cream);
    glow(70, 56, 30, P.amber, 0.3);
  }

  // ---------- Спрайти за фото (data/places.js): RLE-рядки, символ кольору і кількість повторів ----------
  const SPRITE_COLORS = {
    k: P.black, n: P.navy, p: P.plum, s: P.silver, c: P.cream,
    w: P.wine, a: P.amber, b: P.beige, m: P.mint, y: P.cyan, o: P.coral
  };
  const decoded = {};
  function decode(i) {
    if (decoded[i]) return decoded[i];
    const src = window.PLACE_SPRITES && window.PLACE_SPRITES[i];
    if (!src) return null;
    return (decoded[i] = src.map(r => {
      let out = "";
      r.replace(/(.)(\d*)/g, (_, ch, n) => { out += ch.repeat(n ? +n : 1); });
      return out;
    }));
  }

  function draw(canvas, i) {
    const sprite = decode(i);
    const w = sprite ? sprite[0].length : W, h = sprite ? sprite.length : H;
    canvas.width = w; canvas.height = h;
    ctx = canvas.getContext("2d");
    if (sprite) {
      sprite.forEach((row, y) => { for (let x = 0; x < w; x++) px(x, y, SPRITE_COLORS[row[x]] || P.black); });
    } else {

    for (let y = 0; y < 16; y++) for (let x = 0; x < w; x++) {
      if (dith(x, y, (1 - y / 16) * 0.8)) px(x, y, P.black);

      if (dith(x, y, (y - (h - 14)) / 14)) px(x, y, P.navy);
    }
  }

  window.NESPlaces = { draw, count: 10 };
})();

  const cLat = spots.reduce((a, s) => a + s.lat, 0) / spots.length;
  const cLon = spots.reduce((a, s) => a + s.lon, 0) / spots.length;

    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);

    const padX = 36, padY = 40;
    const spanX = maxX - minX, spanY = maxY - minY;
    const scale = Math.min((width - padX * 2) / spanX, (height - padY * 2) / spanY);

    const to = `${s.lat},${s.lon}`;
    const taxi = s.leg === "taxi";
    let embed, full;
    if (prev) {
      const from = `${prev.lat},${prev.lon}`;
      embed = `https://maps.google.com/maps?saddr=${from}&daddr=${to}&dirflg=${taxi ? "d" : "w"}&hl=uk&output=embed`;
      full = `https://www.google.com/maps/dir/?api=1&origin=${from}&destination=${to}&travelmode=${taxi ? "driving" : "walking"}`;
    } else {
      embed = `https://maps.google.com/maps?q=${to}&z=16&hl=uk&output=embed`;
      full = `https://www.google.com/maps/search/?api=1&query=${to}`;
    }
    if (els.gmap.dataset.src !== embed) { els.gmap.dataset.src = embed; els.gmap.src = embed; }
    els.gmapOpen.href = full;
    els.gmapLabel.textContent = prev ? `- ${prev.name} / ${s.name} -` : "- Місце збору -";
    const mode = taxi ? "d" : "w";
    els.route.href = `https://maps.apple.com/?daddr=${to}&dirflg=${mode}&q=${encodeURIComponent(s.name)}`;
  }

  // Піксельне таксі з data/taxi.js (RLE-рядки: символ кольору і кількість повторів)
  const TAXI_COLORS = {
    k: "#0c0e0c", n: "#141519", p: "#585360", s: "#dfe0df", c: "#fff7e9",
    w: "#58363b", a: "#ca8028", b: "#efc094", o: "#ff8765", r: "#c35353", m: "#92d5b1", y: "#12c5c5",
  };
  (function drawTaxi() {
    const rows = (window.TAXI_SPRITE || []).map(r => {
      let out = "";
      r.replace(/(.)(\d*)/g, (_, ch, n) => { out += ch.repeat(n ? +n : 1); });
      return out;
    });
    if (!rows.length) return;
    const cv = document.getElementById("taxi-icon");
    cv.width = rows[0].length; cv.height = rows.length;
    const cx = cv.getContext("2d");
    rows.forEach((row, y) => [...row].forEach((ch, x) => {
      if (ch === "." || !TAXI_COLORS[ch]) return;
      cx.fillStyle = TAXI_COLORS[ch]; cx.fillRect(x, y, 1, 1);
    }));
  })();

  // Копіювання адреси по дотику
  const taxiHint = document.getElementById("taxi-hint");
  let hintTimer, taxiAddress = "";
  function legacyCopy(text) {
    return new Promise((resolve, reject) => {
      // iOS: textarea має бути редагованою, шрифт 16px (без зуму), виділення через діапазон
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px";
      document.body.append(ta);
      let ok = false;
      try {
        const sel = window.getSelection();
        const range = document.createRange();
        ta.focus({ preventScroll: true });
        range.selectNodeContents(ta);
        sel.removeAllRanges(); sel.addRange(range);
        ta.setSelectionRange(0, text.length);
        ok = document.execCommand("copy");
      } catch (e) {}
      ta.remove();
      ok ? resolve() : reject(new Error("copy failed"));
    });
  }
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).catch(() => legacyCopy(text));
    }
    return legacyCopy(text);
  }
  function setHint(text, ok) {
    taxiHint.textContent = text;
    taxiHint.classList.toggle("ok", !!ok);
  }
  document.getElementById("taxi-copy").addEventListener("click", () => {
    clearTimeout(hintTimer);
    copyText(taxiAddress).then(
      () => setHint("Адресу скопійовано", true),
      () => setHint("Не вдалося скопіювати, виділи адресу вручну", false)
    ).then(() => { hintTimer = setTimeout(() => setHint("Торкнись, щоб скопіювати адресу"), 2200); });
  });

  function updateTaxi(s) {
    const box = document.getElementById("taxi");
    let title, to, addr;
    if (s.leg === "taxi") {
      title = "- Таксі сюди -"; to = s.name; addr = s.address;
    }
    box.hidden = !title;
    if (!title) return;
    document.getElementById("taxi-title").textContent = title;
    document.getElementById("taxi-to").textContent = to;
    document.getElementById("taxi-addr").textContent = addr || "";
    taxiAddress = addr || "";
    clearTimeout(hintTimer);
    setHint("Торкнись, щоб скопіювати адресу");
  }

  // Додаткове піксельне фото точки (data/extra.js), наприклад страва
  function updateExtra() {
    const box = document.getElementById("extra");
    const src = window.PLACE_EXTRA && window.PLACE_EXTRA[step];
    box.hidden = !src;
    if (!src) return;
    const rows = src.map(r => {
      let out = "";
      r.replace(/(.)(\d*)/g, (_, ch, n) => { out += ch.repeat(n ? +n : 1); });
      return out;
    });
    const cv = document.getElementById("extra-img");
    cv.width = rows[0].length; cv.height = rows.length;
    cv.style.aspectRatio = `${cv.width} / ${cv.height}`;
    const cx = cv.getContext("2d");
    cx.clearRect(0, 0, cv.width, cv.height);
    rows.forEach((row, y) => [...row].forEach((ch, x) => {
      if (TAXI_COLORS[ch]) { cx.fillStyle = TAXI_COLORS[ch]; cx.fillRect(x, y, 1, 1); }
    }));
  }

  function render(animate) {
    const s = spots[step];

    gLegs.querySelectorAll(".leg-line").forEach(line => {
      const i = +line.dataset.i;
      line.classList.toggle("done", i < step);
      line.classList.toggle("active", i === step);
      if (animate && i === step) drawLeg(line);
    });

    gDots.querySelectorAll("g").forEach(g => {
      const i = +g.dataset.i;
      const dot = g.querySelector(".dot");
      const halo = g.querySelector(".halo");
      dot.classList.toggle("done", i < step);
      dot.classList.toggle("current", i === step);
      dot.setAttribute("r", i === step ? 8 : 6);
      const num = g.querySelector(".num");
      num.classList.toggle("done", i < step);
      num.classList.toggle("current", i === step);
      halo.style.display = i === step ? "" : "none";
      if (animate && i === step && !reduceMotion) {
        halo.animate([{ transform: "scale(.4)", opacity: .5 }, { transform: "scale(1)", opacity: .18 }],
          { duration: 700, easing: "ease-out", delay: 350, fill: "backwards" });
      }
    });

    if (window.NESPlaces) window.NESPlaces.draw(els.scene, step);
    els.scene.setAttribute("aria-label", `Ілюстрація: ${s.name}`);
    updateRoutes(s);
    updateTaxi(s);
    updateExtra();

    els.time.textContent = s.time;
    const nextSpot = spots[step + 1];
    els.until.textContent = nextSpot ? `до ${nextSpot.time}` : "фінал";
    els.after.replaceChildren(nextSpot ? "далі " : "кінець маршруту");
    if (nextSpot) { const b = document.createElement("b"); b.textContent = nextSpot.name; els.after.append(b); }
    els.name.textContent = s.name;
    els.leg.textContent = s.leg === "taxi" ? "Сюди на таксі" : s.leg === "walk" ? "Сюди пішки" : "";
    els.desc.textContent = s.description;
    els.shelter.textContent = s.shelter;
    const pad = n => String(n).padStart(2, "0");
    els.progress.textContent = `${pad(step + 1)}/${pad(spots.length)}`;
    els.segs.replaceChildren(...spots.map((_, i) => {
      const seg = document.createElement("span");
      seg.className = i <= step ? "seg on" : "seg";
      return seg;
    }));

    els.back.disabled = step === 0;
    els.next.textContent = step === spots.length - 1 ? "Почати знову" : "Далі";

    if (animate) {
      els.card.classList.remove("enter");
      void els.card.offsetWidth;
      els.card.classList.add("enter");
      els.card.scrollTop = 0;
    }
    try { localStorage.setItem("kharkiv-walk-step", step); } catch (e) {}
  }

  els.next.addEventListener("click", () => {
    step = step === spots.length - 1 ? 0 : step + 1;
    render(true);
  });
  els.back.addEventListener("click", () => {
    if (step > 0) { step--; render(true); }
  });

  // Свайп по мапі/картці
  let x0 = null, y0 = 0;
  document.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  document.addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    const dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    if (dx < 0 && step < spots.length - 1) { step++; render(true); }
    if (dx > 0 && step > 0) { step--; render(true); }
  }, { passive: true });

  try {
    const saved = parseInt(localStorage.getItem("kharkiv-walk-step"), 10);
    if (saved >= 0 && saved < spots.length) step = saved;
  } catch (e) {}

  function setAppHeight() { document.documentElement.style.setProperty("--app-h", window.innerHeight + "px"); }
  setAppHeight();
  window.addEventListener("resize", setAppHeight);
  window.addEventListener("orientationchange", () => setTimeout(setAppHeight, 200));

  function layout() { buildProjection(); drawStatic(); render(false); }
  window.addEventListener("resize", layout);
  layout();
  requestAnimationFrame(() => render(true));
})();
</script>
</body>
</html>
