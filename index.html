<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0e0c">
  <meta name="color-scheme" content="dark">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Харків за день">
  <title>Харків за день</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:wght@400;700&family=Montserrat:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <noscript><p style="padding:24px;color:#eaebea;font:16px/1.5 sans-serif">Потрібен JavaScript. Відкрий файл у Safari: Поділитися, потім Відкрити в Safari.</p></noscript>
  <main class="app">
    <section class="scene" aria-label="Як виглядає місце">
      <canvas id="scene" class="nes-pixelated" role="img" aria-label="Піксельна ілюстрація місця"></canvas>
      <header class="bar">
        <span class="nes-logo">-nes-</span>
        <span class="bar-title">Харків за день</span>
      </header>
      <div class="progress" aria-live="polite">
        <div class="segs" id="segs" aria-hidden="true"></div>
        <span class="count" id="progress"></span>
      </div>
    </section>

    <section class="card" id="card" aria-live="polite">
      <div class="head">
        <p class="time" id="time"></p>
        <div class="when">
          <p class="until" id="until"></p>
          <p class="after" id="after"></p>
        </div>
      </div>
      <h1 class="name" id="name"></h1>

      <div class="taxi" id="taxi" hidden>
        <div class="taxi-top">
          <canvas class="taxi-icon nes-pixelated" id="taxi-icon" aria-hidden="true"></canvas>
          <div class="taxi-info">
            <p class="eyebrow" id="taxi-title"></p>
            <p class="taxi-to" id="taxi-to"></p>
          </div>
        </div>
        <button class="taxi-copy" id="taxi-copy" type="button">
          <span class="taxi-copy-text">
            <span class="taxi-label">Адреса для таксі</span>
            <span class="taxi-addr" id="taxi-addr"></span>
          </span>
          <svg class="taxi-copy-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
          <span class="taxi-hint" id="taxi-hint" aria-live="polite"></span>
        </button>
      </div>

      <p class="leg" id="leg"></p>
      <p class="desc" id="desc"></p>
      <p class="shelter" id="shelter"></p>

      <div class="extra" id="extra" hidden>
        <canvas class="extra-img nes-pixelated" id="extra-img" role="img" aria-label="Піксельне фото страви"></canvas>
      </div>

      <div class="block">
        <p class="eyebrow">- Схема ходу -</p>
        <div class="routemap">
          <svg id="map" role="img" aria-labelledby="map-title">
            <title id="map-title">Схема від попередньої точки до поточної</title>
            <g id="river"></g>
            <g id="legs"></g>
            <g id="dots"></g>
          </svg>
        </div>
      </div>

      <div class="block">
        <p class="eyebrow" id="gmap-label">- Маршрут -</p>
        <div class="gmap">
          <iframe id="gmap" title="Маршрут у Google Maps" loading="lazy" referrerpolicy="no-referrer-when-downgrade" tabindex="-1"></iframe>
          <a class="gmap-open" id="gmap-open" target="_blank" rel="noopener" aria-label="Відкрити маршрут у Google Maps на весь екран">
            <span class="chip">На весь екран</span>
          </a>
        </div>
        <a class="route-btn" id="route" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/></svg>
          Побудувати маршрут
        </a>
      </div>
    </section>

    <nav class="controls">
      <button class="back" id="back" type="button" aria-label="Попередня точка">Назад</button>
      <button class="next" id="next" type="button">Далі</button>
    </nav>
  </main>

  <script src="data/spots.js"></script>
  <script src="data/taxi.js"></script>
  <script src="data/places.js"></script>
  <script src="data/extra.js"></script>
  <script src="scenes.js"></script>
  <script src="app.js"></script>
</body>
</html>
